name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Descomprimir el mod
        run: unzip -q mundo-prehistorico-fabric.zip -d project
      - name: Compilar
        working-directory: project/prehistoric
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mundo-prehistorico
          path: |
            project/prehistoric/build/libs/*.jar
            !project/prehistoric/build/libs/*-sources.jar
